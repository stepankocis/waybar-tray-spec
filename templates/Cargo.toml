[package]
name = "app-name"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "TODO: one line saying what the tray item does"

[dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["tokio"] }
libc = { version = "0.2", default-features = false }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "signal", "sync"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
